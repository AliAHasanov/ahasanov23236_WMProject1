<!DOCTYPE html>
<html lang="en">
<head>
    <title>Auditorium Tickets</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

<header> <h1>Ticket Booth</h1> </header>

<main class="grid-container">

    <aside id="seat-details">
        <h2>Seat Details</h2>
        <p>Click a seat to inspect it.</p>
        <dl>
            <dt>Section</dt>
            <dd id="section-details">-</dd>

            <dt>Row</dt>
            <dd id="row-details">-</dd>

            <dt>Seat</dt>
            <dd id="seat-number-details">-</dd>

            <dt>Price</dt>
            <dd id="price-details">-</dd>

            <dt>Status</dt>
            <dd id="status-details">-</dd>
        </dl>

        <button type="button" id="add-to-cart" disabled>Add to Cart</button>
    </aside>

    <section id="map"> 
        <h2 class="centered-text">Auditorium Map</h2>

        <fieldset id="controls" class="flex-container">
        <legend>Controls</legend>  
        <button id="zoom-in" type="button">Zoom In</button>
        <button id="zoom-out" type="button">Zoom Out</button>
        <button id="move-up" type="button">Move Up</button>
        <button id="move-down" type="button">Move Down</button>
        <button id="move-left" type="button">Move Left</button>
        <button id="move-right" type="button">Move Right</button>
        <button id="reset-center" type="button">Reset/Center View</button>
    </fieldset>

    <div id="display">

        
    </div>

    </section>

    <section id="cart">
        <h2>Your Cart</h2>
        <p id="empty-message">Your cart is empty.</p>
        <ul id="cart-items">
            
        </ul>
        <p>Your total is: <span id="total">0</span> manat.</p>
    </section>


</main>
</body>
</html>
